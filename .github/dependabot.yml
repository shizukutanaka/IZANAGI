version: 2
updates:
  # Cargo dependencies. Both crates ship zero runtime dependencies today; this
  # keeps any future dev-dependencies and the lockfile current, and surfaces
  # advisories early. `directory` is the workspace root, where Cargo.toml and
  # Cargo.lock live — Dependabot resolves the whole workspace from there.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  # Keep the CI action versions current. Workflows live at the repo root
  # (.github/workflows/), so this directory is correct as "/". Only direct
  # dependencies get update PRs; transitive bumps are left to review. To have
  # those PRs land themselves, enable GitHub's auto-merge in repo settings —
  # `automerge` is not a dependabot.yml key (unknown keys make GitHub reject
  # the whole config).
  - package-ecosystem: "github-actions"
    directory: "/"
    allow:
      - dependency-type: "direct"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
