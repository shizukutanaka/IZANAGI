version: 2
updates:
  # Cargo dependencies. The crate ships zero runtime dependencies today; this
  # keeps any future dev-dependencies and the lockfile current, and surfaces
  # advisories early.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  # Keep the CI action versions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
