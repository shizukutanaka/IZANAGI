[package]
name = "izanagi_kit"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency reference modules for a deterministic, terminal-first game engine: ECS storage, fixed-point math, seeded RNG, world hashing, and a text content pipeline."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shizukutanaka/IZANAGI"
readme = "README.md"
# "no-std-friendly" was inaccurate (this crate is std-only, see the module
# doc's "All modules are `std`-only" note) and has been replaced with
# "roguelike", which reflects the bulk of the module set (mapgen, fov,
# pathfinding, identify, affix, encounter, ...).
keywords = ["gamedev", "ecs", "deterministic", "fixed-point", "roguelike"]
categories = ["game-development", "data-structures"]
rust-version = "1.75"

[dependencies]

[lib]
path = "src/lib.rs"
