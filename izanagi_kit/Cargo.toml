[package]
name = "izanagi_kit"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency reference modules for a deterministic, terminal-first game engine: ECS storage, fixed-point math, seeded RNG, world hashing, and a text content pipeline."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shizukutanaka/izanagi_kit"
readme = "README.md"
keywords = ["gamedev", "ecs", "deterministic", "fixed-point", "no-std-friendly"]
categories = ["game-development", "data-structures"]
rust-version = "1.75"

[dependencies]

[lib]
path = "src/lib.rs"
