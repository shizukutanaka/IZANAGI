[package]
name = "izanagi_kit"
version = "0.1.0"
edition = "2021"
description = "Prove your game simulation replays bit-identically: bounded model checking, property testing with automatic shrinking, deterministic simulation testing, rollback sync tests, temporal property monitors, and crash-recovery checks — on top of the deterministic primitives they need (fixed-point math, seeded RNG, world hashing). Zero dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shizukutanaka/IZANAGI"
readme = "README.md"
# Keywords target the problem someone actually has when they find this crate —
# a simulation that will not replay the same way twice. "ecs" and "fixed-point"
# were dropped: both are commodity, well served by other crates, and neither is
# why anyone would choose this one. ("no-std-friendly" was removed earlier as
# simply inaccurate; this crate is std-only.)
keywords = ["gamedev", "deterministic", "simulation", "testing", "roguelike"]
categories = ["game-development", "data-structures"]
rust-version = "1.75"

# Development-only files that were shipping to consumers. The git hooks have
# since moved to the repository root (outside this package entirely), but the
# exclude stays as a guard in case one is ever added back here. Tests and
# examples stay: for a crate whose whole claim is "this simulation provably
# replays", the evidence is part of the product.
# Repository-scoped checks are excluded: they read documents and manifests that
# live above this package (AGENT_INSTRUCTIONS.md, the sibling crate's sources),
# so in a published tarball they cannot run at all. Shipping them would hand a
# consumer a `cargo test` run full of failures about files they never received.
# The tests that stay are the ones the note above means — evidence about the
# code, which passes anywhere the crate is unpacked.
exclude = [
    ".githooks/",
    ".gitignore",
    "tests/docs_are_current.rs",
    "tests/global_invariants_hold.rs",
    "tests/msrv_is_respected.rs",
    "tests/parser_matches_its_specification.rs",
    "tests/public_api_is_exercised.rs",
]
documentation = "https://docs.rs/izanagi_kit"

[dependencies]

[lib]
path = "src/lib.rs"

# docs.rs build config. all-features is a no-op today (no features) but makes
# the badge correct if feature groups are added later; the docsrs cfg lets
# doc-only `#[cfg(docsrs)]` attributes (e.g. feature badges) compile there.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
