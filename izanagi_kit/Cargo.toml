[package]
name = "izanagi_kit"
version = "0.1.0"
edition = "2021"
description = "Prove your game simulation replays bit-identically: bounded model checking, property testing with automatic shrinking, deterministic simulation testing, rollback sync tests, temporal property monitors, and crash-recovery checks — on top of the deterministic primitives they need (fixed-point math, seeded RNG, world hashing). Zero dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shizukutanaka/IZANAGI"
readme = "README.md"
# Keywords target the problem someone actually has when they find this crate —
# a simulation that will not replay the same way twice. "ecs" and "fixed-point"
# were dropped: both are commodity, well served by other crates, and neither is
# why anyone would choose this one. ("no-std-friendly" was removed earlier as
# simply inaccurate; this crate is std-only.)
keywords = ["gamedev", "deterministic", "simulation", "testing", "roguelike"]
categories = ["game-development", "data-structures"]
rust-version = "1.75"
documentation = "https://docs.rs/izanagi_kit"

[dependencies]

[lib]
path = "src/lib.rs"

# docs.rs build config. all-features is a no-op today (no features) but makes
# the badge correct if feature groups are added later; the docsrs cfg lets
# doc-only `#[cfg(docsrs)]` attributes (e.g. feature badges) compile there.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
